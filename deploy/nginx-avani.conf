# AVANI Foundation — Nginx configuration
# Copy to /etc/nginx/sites-available/avani, then:
#   sudo ln -s /etc/nginx/sites-available/avani /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot for HTTPS (see DEPLOYMENT.md section 10).

server {
    listen 80;
    server_name avanifoundation.org www.avanifoundation.org;

    root /opt/avani/frontend/build;
    index index.html;

    # Frontend (SPA): always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API -> FastAPI on 127.0.0.1:8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
